<!DOCTYPE html>
<html>
    
    <head>
        <meta charset="utf-8">
        <title>minami</title>
        <link rel="icon" type="image/x-icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script type="text/javascript" src="/scripts.js"></script>
    </head>
    
    <body>
        <div tabindex="0" class="current">
            
            <div class="panel">
                
                <div class="sections">
                    <a class="active">files</a>
                    <a href="/watchlist">watchlist</a>
                    <a href="/rules">rules</a>
                    <a href="/feeds">feeds</a>
                </div>
                
                <input type="text" class="filter" placeholder="filter">
                
            </div>
            
            <div data-refresh="/files/entries" class="list sorted show-primary show-tertiary">
            </div>
            
            <div class="panel">
                
                <div class="actions">
                    <a data-url="/files/play">play</a>
                    <a data-url="/files/mark" class="refresh">mark</a>
                    <a data-url="/files/folder" class="prompt refresh">folder</a>
                    <a data-url="/files/delete" class="confirm refresh">delete</a>
                </div>
                
                <div class="toggles">
                    <label data-value="show-primary" data-active="">unmarked</label>
                    <label data-value="show-secondary">marked</label>
                    <label data-value="show-tertiary" data-active="">containers</label>
                </div>
                
            </div>
            
        </div>
    </body>
    
</html>
