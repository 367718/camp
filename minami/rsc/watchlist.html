<!DOCTYPE html>
<html>
    
    <head>
        <meta charset="utf-8">
        <title>minami</title>
        <link rel="icon" type="image/x-icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script type="text/javascript" src="/scripts.js"></script>
    </head>
    
    <body>
        
        <div class="header">
            
            <div class="sections">
                <a href="/files">Files</a>
                <a>Watchlist</a>
                <a href="/rules">Rules</a>
                <a href="/feeds">Feeds</a>
            </div>
            
            <input type="text" class="filter" placeholder="Filter">
            
            <div class="actions">
                <a data-url="/watchlist/insert" data-confirm="false" data-prompt="true" data-refresh="true">Insert</a>
                <a data-url="/watchlist/update" data-confirm="false" data-prompt="true" data-refresh="true">Update</a>
                <a data-url="/watchlist/delete" data-confirm="true" data-prompt="false" data-refresh="true">Delete</a>
            </div>
            
            <div class="toggles">
                <a data-attr="data-primary" data-enabled="true">Watched</a>
                <a data-attr="data-secondary" data-enabled="true">Unwatched</a>
            </div>
            
        </div>
        
        <div data-refresh="/watchlist/entries" data-sorted="true" data-value="true" data-primary="true" data-secondary="true" data-tertiary="false" class="list"></div>
        
    </body>
    
</html>
