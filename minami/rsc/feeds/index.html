<!DOCTYPE html>
<html class="ena">
    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Minami</title>
        <link rel="icon" type="image/x-icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script type="text/javascript" src="/scripts.js"></script>
    </head>
    
    <body>
        <div tabindex="0" class="current">
            
            <div class="panel">
                
                <div class="sections">
                    <a href="/files">Files</a>
                    <a href="/watchlist">Watchlist</a>
                    <a href="/rules">Rules</a>
                    <a class="active">Feeds</a>
                </div>
                
                <input type="text" class="filter" placeholder="Filter">
                
            </div>
            
            <div data-refresh="/feeds/entries" class="list show-primary">
            </div>
            
            <div class="panel">
                
                <div class="actions">
                    <a data-url="/feeds/insert" class="prompt refresh">Insert</a>
                    <a data-url="/feeds/delete" class="confirm refresh">Delete</a>
                </div>
                
            </div>
            
        </div>
    </body>
    
</html>
