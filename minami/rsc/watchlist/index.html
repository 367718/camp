<!DOCTYPE html>
<html class="nadeshiko">
    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Minami</title>
        <link rel="icon" type="image/x-icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script type="text/javascript" src="/scripts.js"></script>
    </head>
    
    <body>
        <div tabindex="0" class="current">
            
            <div class="panel">
                
                <div class="sections">
                    <a href="/files">Files</a>
                    <a class="active">Watchlist</a>
                    <a href="/rules">Rules</a>
                    <a href="/feeds">Feeds</a>
                </div>
                
                <input type="text" class="filter" placeholder="Filter">
                
            </div>
            
            <div data-refresh="/watchlist/entries" class="list sorted show-value show-primary show-secondary">
            </div>
            
            <div class="panel">
                
                <div class="actions">
                    <a data-url="/watchlist/insert" class="prompt refresh">Insert</a>
                    <a data-url="/watchlist/update" class="prompt refresh">Update</a>
                    <a data-url="/watchlist/delete" class="confirm refresh">Delete</a>
                </div>
                
                <div class="toggles">
                    <label data-value="show-primary" data-active="">Watched</label>
                    <label data-value="show-secondary" data-active="">Unwatched</label>
                </div>
                
            </div>
            
        </div>
    </body>
    
</html>
